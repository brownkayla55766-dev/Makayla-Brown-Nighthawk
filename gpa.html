<div class="header">

<h1>GPA Calculator</h1>

<p>Academic Planning Tool</p>

</div>



<div class="main">


<div class="box">


<h2>Calculate GPA</h2>


<input id="grade1" placeholder="Grade Points">

<input id="grade2" placeholder="Grade Points">

<input id="grade3" placeholder="Grade Points">


<button onclick="calculate()">
Calculate
</button>


<h2 id="answer"></h2>


</div>


</div>



<script>

function calculate(){

let a=Number(document.getElementById("grade1").value);

let b=Number(document.getElementById("grade2").value);

let c=Number(document.getElementById("grade3").value);


let result=(a+b+c)/3;


document.getElementById("answer").innerHTML=
"GPA: " + result.toFixed(2);

}

</script>
